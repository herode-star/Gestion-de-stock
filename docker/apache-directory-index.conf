DirectoryIndex index.php
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    <FilesMatch "^(\.|.*\.(sql|md|yml|json|lock|sh|py|ini)$|Dockerfile$)">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/(core|classe|bd|docker|tests|scripts)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html/produit>
    <FilesMatch "\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "/\.">
    Require all denied
</LocationMatch>
