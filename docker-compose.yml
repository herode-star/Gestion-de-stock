services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: database
      DB_NAME: Otechnologie
      DB_USER: stock_user
      DB_PASSWORD: ${DB_PASSWORD:?Ranpli DB_PASSWORD nan .env}
      APP_TIMEZONE: America/Toronto
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    volumes:
      - stock_images:/var/www/html/produit
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: Otechnologie
      MARIADB_USER: stock_user
      MARIADB_PASSWORD: ${DB_PASSWORD:?Ranpli DB_PASSWORD nan .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Ranpli DB_ROOT_PASSWORD nan .env}
    volumes:
      - stock_data:/var/lib/mysql
      - ./bd/otechnologie.sql:/docker-entrypoint-initdb.d/01-otechnologie.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  stock_data:
  stock_images:
